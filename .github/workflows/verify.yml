# Every gate, on every push and every pull request.
#
# Before this existed nothing verified a pull request. GitHub's "mergeable"
# meant only that the branch had no conflict, so a pull request could be merged
# on the strength of somebody saying the gates passed. One was: pull request #1
# carried 26 commits and 276 pages with no check against it. See decision 021.
#
# The job runs `make verify`, which is the same command a contributor runs
# locally. Two commands that are meant to agree and are written out separately
# drift, so there is one.

name: verify

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A second push to the same branch cancels the first: the older run is
  # checking a commit nobody will merge.
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          # check_clean.py is the last gate and it asks git what changed, so the
          # checkout needs to be a real repository rather than an export.
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the two optional libraries
        # openpyxl and python-docx are needed for the spreadsheet and Word
        # review packs. The tests skip rather than fail without them, so a
        # checkout that lacks them still verifies the markdown path. Here they
        # are installed, so the skips do not hide a fault.
        run: python -m pip install --disable-pip-version-check "openpyxl==3.1.5" "python-docx==1.2.0"

      - name: make verify
        run: make verify

      - name: Report what is outstanding
        # Not a gate. The counts belong in the log of every run, because the
        # thing most likely to be forgotten about this repository is that none
        # of it has been reviewed.
        if: always()
        run: |
          python3 tools/review_pack.py --status | tail -3
          python3 tools/figures.py --report 2>/dev/null | tail -3 || true
